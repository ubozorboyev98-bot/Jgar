services:
  - type: web
    name: jgar-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r sonnet_final/requirements.txt
    startCommand: python sonnet_final/sonnet_final.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "8764954646,6391842049"
      - key: LOG_CHAT_ID
        value: "-1003521804500"